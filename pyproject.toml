[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "precipitation-watch"
version = "0.1.0"
description = "A hackathon prototype for classifying KNMI hourly precipitation."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools]
py-modules = ["precipitation"]
